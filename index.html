<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0, viewport-fit=cover">
  <title>Count Control Legends</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #game-container {
      position: relative;
      width: 100%;
      height: 100%;
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    /* Unity Canvas - Starts at opacity: 0 to guarantee NO "Made with Unity" flash */
    #unity-canvas {
      width: 100% !important;
      height: 100% !important;
      display: block;
      outline: none;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.5s ease;
    }

    /* Thumbnail Cover & Loading Screen */
    #game-splash-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #0b0c14;
      background-image: url('thumbnail.png');
      background-position: center;
      background-repeat: no-repeat;
      background-size: cover;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
      z-index: 100;
      transition: opacity 0.6s ease, visibility 0.6s ease;
    }

    /* Subtle dark gradient overlay over thumbnail for contrast */
    #game-splash-overlay::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(0,0,0,0.1) 0%, rgba(0,0,0,0.6) 80%, rgba(0,0,0,0.92) 100%);
      pointer-events: none;
    }

    .splash-bottom-bar {
      position: relative;
      z-index: 2;
      width: 100%;
      padding: 20px 24px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .loader-status-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: rgba(255, 255, 255, 0.85);
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.5px;
      text-shadow: 0 2px 6px rgba(0,0,0,0.8);
    }

    .loader-track {
      width: 100%;
      height: 6px;
      background: rgba(255, 255, 255, 0.18);
      border-radius: 6px;
      overflow: hidden;
      backdrop-filter: blur(4px);
    }

    .loader-fill {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #00d2ff, #0072ff);
      border-radius: 6px;
      transition: width 0.2s ease-out;
      box-shadow: 0 0 12px rgba(0, 210, 255, 0.9);
    }

    /* PC Controls Floating Pill HUD (Desktop only, hidden on mobile) */
    .pc-controls-guide {
      position: absolute;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      background: rgba(10, 12, 22, 0.78);
      backdrop-filter: blur(10px);
      padding: 8px 18px;
      border-radius: 24px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: rgba(255, 255, 255, 0.85);
      font-size: 13px;
      font-weight: 500;
      pointer-events: none;
      z-index: 10;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
      transition: opacity 0.5s ease;
    }
    .pc-key {
      display: inline-block;
      padding: 2px 7px;
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 4px;
      color: #fff;
      font-family: monospace;
      font-size: 12px;
    }

    /* Audio Toggle Button (Top Right) */
    #sound-toggle {
      position: absolute;
      top: 14px;
      right: 14px;
      z-index: 20;
      background: rgba(15, 17, 28, 0.7);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      border-radius: 50%;
      width: 38px;
      height: 38px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 17px;
      transition: transform 0.15s ease, background 0.15s ease;
    }
    #sound-toggle:active {
      transform: scale(0.92);
      background: rgba(255, 255, 255, 0.2);
    }

    /* Mobile: 100% Fullscreen, clean layout */
    @media (max-width: 599px), (max-height: 499px), (pointer: coarse) {
      .pc-controls-guide {
        display: none !important;
      }
    }
  </style>
</head>
<body>
  <div id="game-container">
    <canvas id="unity-canvas" tabindex="-1"></canvas>

    <!-- Thumbnail Cover / Splash Screen (Hides Unity splash screen 100%) -->
    <div id="game-splash-overlay">
      <div class="splash-bottom-bar">
        <div class="loader-status-row">
          <span id="splash-status-text">Loading...</span>
          <span id="splash-percent">0%</span>
        </div>
        <div class="loader-track">
          <div id="splash-bar" class="loader-fill"></div>
        </div>
      </div>
    </div>

    <!-- PC Controls Guide (Floating HUD, desktop only) -->
    <div class="pc-controls-guide" id="pc-guide">
      <span>⌨️ <span class="pc-key">A</span> / <span class="pc-key">D</span> or <span class="pc-key">◄</span> / <span class="pc-key">►</span> Steer</span>
      <span>•</span>
      <span>🖱️ Drag to Move</span>
      <span>•</span>
      <span><span class="pc-key">Space</span> Tap to Start</span>
    </div>

    <!-- Sound Toggle Button -->
    <button id="sound-toggle" title="Toggle Sound">🔊</button>
  </div>

  <!-- Background Music Player (Plays amin.mp3 on loop) -->
  <audio id="bgm-player" src="amin.mp3" loop preload="auto"></audio>

  <!-- Complete Zero-Ad Poki SDK & PokiBridge Mock -->
  <script>
    window.pokiReady = true;
    window.pokiAdBlock = false;
    window.pokiBridge = null;

    let unityGameInstance = null;
    let isGameRevealed = false;

    function revealGame() {
      if (isGameRevealed) return;
      isGameRevealed = true;

      const canvas = document.querySelector("#unity-canvas");
      const overlay = document.querySelector("#game-splash-overlay");

      console.log('[Runner] Revealing game directly on 3D scene!');
      if (canvas) {
        canvas.style.opacity = "1";
        canvas.style.pointerEvents = "auto";
      }

      if (overlay) {
        overlay.style.opacity = "0";
        setTimeout(() => {
          overlay.style.display = "none";
        }, 600);
      }

      // Try autoplaying background music
      startBgm();
    }

    window.initPokiBridge = function(name) {
      console.log('[PokiBridge] initPokiBridge called for:', name);
      window.pokiBridge = name;
      function notifyReady() {
        if (window.unityGame) {
          try {
            window.unityGame.SendMessage(name, "ready");
          } catch(e) {}
        } else {
          setTimeout(notifyReady, 50);
        }
      }
      notifyReady();
    };

    window.commercialBreak = function() {
      if (window.unityGame && window.pokiBridge) {
        try { window.unityGame.SendMessage(window.pokiBridge, "commercialBreakCompleted"); } catch(e) {}
      }
      return Promise.resolve();
    };

    window.rewardedBreak = function(options) {
      if (window.unityGame && window.pokiBridge) {
        try { window.unityGame.SendMessage(window.pokiBridge, "rewardedBreakCompleted", "true"); } catch(e) {}
      }
      return Promise.resolve(true);
    };

    window.PokiSDK = {
      init: function() { return Promise.resolve(); },
      gameplayStart: function() {
        console.log('[PokiSDK] gameplayStart fired');
        revealGame();
      },
      gameplayStop: function() { console.log('[PokiSDK] gameplayStop'); },
      gameLoadingStart: function() {},
      gameLoadingFinished: function() {
        console.log('[PokiSDK] gameLoadingFinished fired');
        revealGame();
      },
      commercialBreak: window.commercialBreak,
      rewardedBreak: window.rewardedBreak,
      displayAd: function() {},
      destroyAd: function() {},
      getLanguage: function() { return "en"; },
      getURLParam: function() { return ""; },
      isAdBlocked: function() { return false; },
      logError: function(err) { console.warn('[PokiSDK Error Log]', err); },
      measure: function() {},
      customEvent: function() {}
    };
  </script>

  <!-- Background Music Controller -->
  <script>
    const bgm = document.getElementById('bgm-player');
    const soundToggle = document.getElementById('sound-toggle');
    let isMuted = false;

    function startBgm() {
      if (bgm && !isMuted) {
        bgm.volume = 0.55;
        bgm.play().catch(e => {
          // Autoplay policy waiting for user click
          console.log('[BGM] Waiting for first user click to play audio');
        });
      }
    }

    soundToggle.addEventListener('click', (e) => {
      e.stopPropagation();
      if (!bgm) return;
      isMuted = !isMuted;
      if (isMuted) {
        bgm.pause();
        soundToggle.textContent = '🔇';
      } else {
        bgm.play().catch(e => {});
        soundToggle.textContent = '🔊';
      }
    });

    // Unlock audio on any first user tap / key
    function userUnlockAudio() {
      if (bgm && !isMuted && bgm.paused) {
        bgm.play().catch(e => {});
      }
    }
    window.addEventListener('pointerdown', userUnlockAudio, { once: true });
    window.addEventListener('keydown', userUnlockAudio, { once: true });
  </script>

  <!-- Unity WebGL Loader -->
  <script src="Build/c7cea366ea8eaab59722a8d24073643f.loader.js"></script>

  <script>
    const canvas = document.querySelector("#unity-canvas");
    const splashBar = document.getElementById("splash-bar");
    const splashPercent = document.getElementById("splash-percent");
    const splashStatus = document.getElementById("splash-status-text");

    // Dynamic Mobile/PC detection check
    function checkDeviceView() {
      const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) || (window.matchMedia && window.matchMedia('(pointer: coarse)').matches) || window.innerWidth < 600;
      const pcGuide = document.getElementById("pc-guide");
      if (pcGuide) {
        pcGuide.style.display = isMobile ? "none" : "";
      }
    }
    window.addEventListener('resize', checkDeviceView);
    checkDeviceView();

    const buildUrl = "Build";
    // NOTE: UnityCache preserves assets in IndexedDB so all future loads are near-instant!
    const config = {
      dataUrl: buildUrl + "/180b03074745078a7fe292b2c22f6060.data.unityweb",
      frameworkUrl: buildUrl + "/2320a17ab13f3e61f4a62a2cc0382528.framework.js.unityweb",
      codeUrl: buildUrl + "/f1c87ec2ef0c4ed9b3c34bb439b0c5de.wasm.unityweb",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "Jungle Tavern",
      productName: "Count Control Legends",
      productVersion: "1.0.0",
      devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2)
    };

    createUnityInstance(canvas, config, (progress) => {
      const pct = Math.min(100, Math.round(progress * 100));
      if (splashBar) splashBar.style.width = pct + "%";
      if (splashPercent) splashPercent.textContent = pct + "%";
      if (splashStatus) {
        if (pct < 100) {
          splashStatus.textContent = "Loading " + pct + "%";
        } else {
          splashStatus.textContent = "Starting...";
        }
      }
    }).then((unityInstance) => {
      window.unityInstance = unityInstance;
      window.unityGame = unityInstance;
      unityGameInstance = unityInstance;

      if (splashBar) splashBar.style.width = "100%";
      if (splashPercent) splashPercent.textContent = "100%";
      if (splashStatus) splashStatus.textContent = "Ready";

      // CRITICAL: Unity engine plays its internal splash screen on canvas for ~2.5 - 3.0 seconds
      // By keeping canvas opacity at 0 and overlay active for 3400ms, "Made with Unity" is 100% INVISIBLE!
      setTimeout(() => {
        revealGame();
      }, 3400);

      if (window.pokiBridge) {
        try {
          window.unityGame.SendMessage(window.pokiBridge, "ready");
        } catch(e) {}
      }
    }).catch((message) => {
      console.error("Unity Load Error:", message);
    });

    // PC Keyboard Steer Helper: Seamless A/D & Arrow Left/Right to simulated drag
    let isKeySteering = false;
    let keySteerOffset = 0;
    const activeKeys = {};

    window.addEventListener('keydown', (e) => {
      activeKeys[e.code] = true;
      if (e.code === 'KeyA' || e.code === 'ArrowLeft' || e.code === 'KeyD' || e.code === 'ArrowRight') {
        if (!isKeySteering) {
          isKeySteering = true;
          startKeyDrag();
        }
      }
    });

    window.addEventListener('keyup', (e) => {
      delete activeKeys[e.code];
      if (!activeKeys['KeyA'] && !activeKeys['ArrowLeft'] && !activeKeys['KeyD'] && !activeKeys['ArrowRight']) {
        isKeySteering = false;
        stopKeyDrag();
      }
    });

    let dragInterval = null;
    let curX = 0;
    let curY = 0;

    function startKeyDrag() {
      const rect = canvas.getBoundingClientRect();
      curX = rect.left + rect.width / 2;
      curY = rect.top + rect.height * 0.7;

      canvas.dispatchEvent(new PointerEvent('pointerdown', {
        clientX: curX,
        clientY: curY,
        bubbles: true,
        pointerId: 1
      }));

      if (dragInterval) clearInterval(dragInterval);
      dragInterval = setInterval(() => {
        if (!isKeySteering) {
          clearInterval(dragInterval);
          return;
        }
        let dir = 0;
        if (activeKeys['KeyA'] || activeKeys['ArrowLeft']) dir -= 1;
        if (activeKeys['KeyD'] || activeKeys['ArrowRight']) dir += 1;

        const rect = canvas.getBoundingClientRect();
        curX += dir * 18;
        curX = Math.max(rect.left + 20, Math.min(rect.right - 20, curX));

        canvas.dispatchEvent(new PointerEvent('pointermove', {
          clientX: curX,
          clientY: curY,
          bubbles: true,
          pointerId: 1
        }));
      }, 16);
    }

    function stopKeyDrag() {
      if (dragInterval) clearInterval(dragInterval);
      canvas.dispatchEvent(new PointerEvent('pointerup', {
        clientX: curX,
        clientY: curY,
        bubbles: true,
        pointerId: 1
      }));
    }
  </script>
</body>
</html>
