<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0, viewport-fit=cover">
  <title>Count Control Legends</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #08090f;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #game-container {
      position: relative;
      width: 100%;
      height: 100%;
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }
    #unity-canvas {
      width: 100% !important;
      height: 100% !important;
      display: block;
      outline: none;
    }

    /* Branded Loading Splash Screen (Hides "Made with Unity" and dead black screen) */
    #game-splash-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at center, #181d2e 0%, #08090f 100%);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 100;
      transition: opacity 0.6s ease, visibility 0.6s ease;
    }
    .splash-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 24px;
      max-width: 420px;
      width: 88%;
    }
    .game-badge {
      background: linear-gradient(135deg, #ff9800, #ff5722);
      color: #fff;
      font-weight: 800;
      font-size: 11px;
      letter-spacing: 2px;
      padding: 4px 14px;
      border-radius: 20px;
      text-transform: uppercase;
      margin-bottom: 16px;
      box-shadow: 0 4px 14px rgba(255, 87, 34, 0.4);
    }
    .splash-title {
      color: #ffffff;
      font-size: 32px;
      font-weight: 900;
      letter-spacing: 1.5px;
      line-height: 1.15;
      margin-bottom: 24px;
      text-shadow: 0 4px 20px rgba(0, 0, 0, 0.8);
    }
    .splash-title span {
      background: linear-gradient(135deg, #4fc3f7, #0288d1);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .loader-box {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .loader-track {
      width: 100%;
      height: 10px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.12);
    }
    .loader-fill {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #00d2ff, #0072ff);
      border-radius: 10px;
      transition: width 0.2s ease-out;
      box-shadow: 0 0 14px rgba(0, 210, 255, 0.8);
    }
    .loader-status {
      display: flex;
      justify-content: space-between;
      color: rgba(255, 255, 255, 0.7);
      font-size: 13px;
      font-weight: 500;
    }

    /* PC Controls Floating Pill HUD (Desktop only, hidden on mobile) */
    .pc-controls-guide {
      position: absolute;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      background: rgba(10, 12, 22, 0.78);
      backdrop-filter: blur(10px);
      padding: 8px 18px;
      border-radius: 24px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: rgba(255, 255, 255, 0.85);
      font-size: 13px;
      font-weight: 500;
      pointer-events: none;
      z-index: 10;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
      transition: opacity 0.5s ease;
    }
    .pc-key {
      display: inline-block;
      padding: 2px 7px;
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 4px;
      color: #fff;
      font-family: monospace;
      font-size: 12px;
    }

    /* Mobile: Completely clean fullscreen */
    @media (max-width: 599px), (max-height: 499px), (pointer: coarse) {
      .pc-controls-guide {
        display: none !important;
      }
    }
  </style>
</head>
<body>
  <div id="game-container">
    <canvas id="unity-canvas" tabindex="-1"></canvas>

    <!-- Custom Splash / Loading Screen -->
    <div id="game-splash-overlay">
      <div class="splash-content">
        <div class="game-badge">3D RUNNER</div>
        <h1 class="splash-title">COUNT CONTROL<br><span>LEGENDS</span></h1>

        <div class="loader-box">
          <div class="loader-track">
            <div id="splash-bar" class="loader-fill"></div>
          </div>
          <div class="loader-status">
            <span id="splash-status-text">Loading 3D world...</span>
            <span id="splash-percent">0%</span>
          </div>
        </div>
      </div>
    </div>

    <!-- PC Controls Guide (Floating HUD, desktop only) -->
    <div class="pc-controls-guide" id="pc-guide">
      <span>⌨️ <span class="pc-key">A</span> / <span class="pc-key">D</span> or <span class="pc-key">◄</span> / <span class="pc-key">►</span> Steer</span>
      <span>•</span>
      <span>🖱️ Drag to Move</span>
      <span>•</span>
      <span><span class="pc-key">Space</span> Tap to Start</span>
    </div>
  </div>

  <!-- Background Music Player -->
  <audio id="bgm-player" loop preload="auto"></audio>

  <!-- Complete Zero-Ad Poki SDK & PokiBridge Mock -->
  <script>
    window.pokiReady = true;
    window.pokiAdBlock = false;
    window.pokiBridge = null;

    window.initPokiBridge = function(name) {
      console.log('[PokiBridge] initPokiBridge called for:', name);
      window.pokiBridge = name;
      function notifyReady() {
        if (window.unityGame) {
          console.log('[PokiBridge] Notifying ready to:', name);
          try {
            window.unityGame.SendMessage(name, "ready");
          } catch(e) {
            console.error('[PokiBridge] Error sending ready:', e);
          }
        } else {
          setTimeout(notifyReady, 50);
        }
      }
      notifyReady();
    };

    window.commercialBreak = function() {
      console.log('[PokiBridge] commercialBreak() -> immediately resolving');
      if (window.unityGame && window.pokiBridge) {
        try {
          window.unityGame.SendMessage(window.pokiBridge, "commercialBreakCompleted");
        } catch(e) {}
      }
      return Promise.resolve();
    };

    window.rewardedBreak = function(options) {
      console.log('[PokiBridge] rewardedBreak() -> granting reward instantly');
      if (window.unityGame && window.pokiBridge) {
        try {
          window.unityGame.SendMessage(window.pokiBridge, "rewardedBreakCompleted", "true");
        } catch(e) {}
      }
      return Promise.resolve(true);
    };

    window.PokiSDK = {
      init: function() { return Promise.resolve(); },
      gameplayStart: function() { console.log('[PokiSDK] gameplayStart'); },
      gameplayStop: function() { console.log('[PokiSDK] gameplayStop'); },
      gameLoadingStart: function() {},
      gameLoadingFinished: function() {},
      commercialBreak: window.commercialBreak,
      rewardedBreak: window.rewardedBreak,
      displayAd: function() {},
      destroyAd: function() {},
      getLanguage: function() { return "en"; },
      getURLParam: function() { return ""; },
      isAdBlocked: function() { return false; },
      logError: function(err) { console.warn('[PokiSDK Error Log]', err); },
      measure: function() {},
      customEvent: function() {}
    };
  </script>

  <!-- Background Music Helper -->
  <script>
    window.playBgm = function(url) {
      const audio = document.getElementById('bgm-player');
      if (audio) {
        if (url) audio.src = url;
        audio.volume = 0.5;
        audio.play().catch(e => console.log('[BGM] Waiting for user interaction to autoplay audio'));
      }
    };
    window.setBgmVolume = function(vol) {
      const audio = document.getElementById('bgm-player');
      if (audio) audio.volume = vol;
    };

    // User gesture unlock for audio
    function userAudioUnlock() {
      const audio = document.getElementById('bgm-player');
      if (audio && audio.src && audio.paused) {
        audio.play().catch(e => {});
      }
    }
    window.addEventListener('pointerdown', userAudioUnlock, { once: true });
    window.addEventListener('keydown', userAudioUnlock, { once: true });
  </script>

  <!-- Unity WebGL Loader -->
  <script src="Build/c7cea366ea8eaab59722a8d24073643f.loader.js"></script>

  <script>
    const canvas = document.querySelector("#unity-canvas");
    const splashOverlay = document.getElementById("game-splash-overlay");
    const splashBar = document.getElementById("splash-bar");
    const splashPercent = document.getElementById("splash-percent");
    const splashStatus = document.getElementById("splash-status-text");

    // Dynamic Mobile/PC detection check
    function checkDeviceView() {
      const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) || (window.matchMedia && window.matchMedia('(pointer: coarse)').matches) || window.innerWidth < 600;
      const pcGuide = document.getElementById("pc-guide");
      if (pcGuide) {
        pcGuide.style.display = isMobile ? "none" : "";
      }
    }
    window.addEventListener('resize', checkDeviceView);
    checkDeviceView();

    const buildUrl = "Build";
    // NOTE: We do NOT delete UnityCache so that IndexedDB caches the 28MB build for instant reloads!
    const config = {
      dataUrl: buildUrl + "/180b03074745078a7fe292b2c22f6060.data.unityweb",
      frameworkUrl: buildUrl + "/2320a17ab13f3e61f4a62a2cc0382528.framework.js.unityweb",
      codeUrl: buildUrl + "/f1c87ec2ef0c4ed9b3c34bb439b0c5de.wasm.unityweb",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "Jungle Tavern",
      productName: "Count Control Legends",
      productVersion: "1.0.0",
      devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2)
    };

    createUnityInstance(canvas, config, (progress) => {
      const pct = Math.min(100, Math.round(progress * 100));
      if (splashBar) splashBar.style.width = pct + "%";
      if (splashPercent) splashPercent.textContent = pct + "%";
      if (splashStatus) {
        if (pct < 45) {
          splashStatus.textContent = "Loading 3D world...";
        } else if (pct < 90) {
          splashStatus.textContent = "Compiling game engine...";
        } else {
          splashStatus.textContent = "Starting runner...";
        }
      }
    }).then((unityInstance) => {
      window.unityInstance = unityInstance;
      window.unityGame = unityInstance;

      // Ensure progress bar reaches 100%
      if (splashBar) splashBar.style.width = "100%";
      if (splashPercent) splashPercent.textContent = "100%";
      if (splashStatus) splashStatus.textContent = "Ready!";

      // Fade out overlay smoothly after Unity completes its internal canvas initialization
      // This ensures "Made with Unity" is completely hidden behind the splash overlay!
      setTimeout(() => {
        if (splashOverlay) {
          splashOverlay.style.opacity = "0";
          setTimeout(() => {
            splashOverlay.style.display = "none";
          }, 600);
        }
      }, 700);

      if (window.pokiBridge) {
        try {
          window.unityGame.SendMessage(window.pokiBridge, "ready");
        } catch(e) {}
      }
      console.log("Count Control Legends running smoothly!");
    }).catch((message) => {
      console.error("Unity Load Error:", message);
    });

    // PC Keyboard Steer Helper: Seamless A/D & Arrow Left/Right to simulated drag
    let isKeySteering = false;
    let keySteerOffset = 0;
    const activeKeys = {};

    window.addEventListener('keydown', (e) => {
      activeKeys[e.code] = true;
      if (e.code === 'KeyA' || e.code === 'ArrowLeft' || e.code === 'KeyD' || e.code === 'ArrowRight') {
        if (!isKeySteering) {
          isKeySteering = true;
          startKeyDrag();
        }
      }
    });

    window.addEventListener('keyup', (e) => {
      delete activeKeys[e.code];
      if (!activeKeys['KeyA'] && !activeKeys['ArrowLeft'] && !activeKeys['KeyD'] && !activeKeys['ArrowRight']) {
        isKeySteering = false;
        stopKeyDrag();
      }
    });

    let dragInterval = null;
    let curX = 0;
    let curY = 0;

    function startKeyDrag() {
      const rect = canvas.getBoundingClientRect();
      curX = rect.left + rect.width / 2;
      curY = rect.top + rect.height * 0.7;

      canvas.dispatchEvent(new PointerEvent('pointerdown', {
        clientX: curX,
        clientY: curY,
        bubbles: true,
        pointerId: 1
      }));

      if (dragInterval) clearInterval(dragInterval);
      dragInterval = setInterval(() => {
        if (!isKeySteering) {
          clearInterval(dragInterval);
          return;
        }
        let dir = 0;
        if (activeKeys['KeyA'] || activeKeys['ArrowLeft']) dir -= 1;
        if (activeKeys['KeyD'] || activeKeys['ArrowRight']) dir += 1;

        const rect = canvas.getBoundingClientRect();
        curX += dir * 18;
        curX = Math.max(rect.left + 20, Math.min(rect.right - 20, curX));

        canvas.dispatchEvent(new PointerEvent('pointermove', {
          clientX: curX,
          clientY: curY,
          bubbles: true,
          pointerId: 1
        }));
      }, 16);
    }

    function stopKeyDrag() {
      if (dragInterval) clearInterval(dragInterval);
      canvas.dispatchEvent(new PointerEvent('pointerup', {
        clientX: curX,
        clientY: curY,
        bubbles: true,
        pointerId: 1
      }));
    }
  </script>
</body>
</html>
