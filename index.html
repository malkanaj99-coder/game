<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0, viewport-fit=cover">
  <title>Mob Control</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #game-container {
      position: relative;
      width: 100%;
      height: 100%;
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    /* Unity Canvas - Starts at opacity: 0 to guarantee NO "Made with Unity" or empty skybox flash */
    #unity-canvas {
      width: 100% !important;
      height: 100% !important;
      display: block;
      outline: none;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.5s ease;
    }

    /* Full-Screen 4K High-Res Thumbnail Cover */
    #game-splash-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #0b0c14;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
      z-index: 100;
      overflow: hidden;
      transition: opacity 0.6s ease, visibility 0.6s ease;
    }

    #splash-bg-img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 30%;
      z-index: 0;
      pointer-events: none;
    }

    /* Soft bottom vignette gradient for pristine text readability */
    .splash-vignette {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 52%;
      background: linear-gradient(180deg, rgba(0,0,0,0) 0%, rgba(0,0,0,0.6) 45%, rgba(0,0,0,0.96) 100%);
      pointer-events: none;
      z-index: 1;
    }

    /* Bottom Loading Area matching reference UI */
    .loader-bottom-area {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 440px;
      padding: 0 24px 38px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 9px;
    }

    /* Capsule Pill Loading Bar */
    .capsule-track {
      position: relative;
      width: 100%;
      height: 38px;
      background: rgba(10, 14, 24, 0.82);
      border: 2.5px solid rgba(255, 255, 255, 0.35);
      border-radius: 24px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.8), inset 0 2px 5px rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .capsule-fill {
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 0%;
      background: linear-gradient(90deg, #00e676 0%, #00c853 100%);
      border-radius: 20px;
      box-shadow: 0 0 20px rgba(0, 230, 118, 0.95);
      transition: width 0.1s linear;
    }

    .capsule-percent {
      position: relative;
      z-index: 2;
      color: #ffffff;
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 0.5px;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.95);
    }

    .loader-status-text {
      color: #ffffff;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.4px;
      text-shadow: 0 2px 6px rgba(0, 0, 0, 0.95);
      margin-top: 2px;
    }

    /* Dynamic Tip Pill */
    .tip-pill {
      display: flex;
      align-items: center;
      gap: 7px;
      background: rgba(14, 18, 30, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 20px;
      padding: 7px 20px;
      color: #ffe082;
      font-size: 13px;
      font-weight: 600;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.6);
      margin-top: 4px;
      text-align: center;
    }
    .tip-pill span {
      color: #fff;
      font-weight: 500;
    }

    /* PC Controls Floating Pill HUD (Desktop only, hidden on mobile) */
    .pc-controls-guide {
      position: absolute;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      background: rgba(10, 12, 22, 0.8);
      backdrop-filter: blur(10px);
      padding: 8px 18px;
      border-radius: 24px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: rgba(255, 255, 255, 0.85);
      font-size: 13px;
      font-weight: 500;
      pointer-events: none;
      z-index: 10;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
      transition: opacity 0.5s ease;
    }
    .pc-key {
      display: inline-block;
      padding: 2px 7px;
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 4px;
      color: #fff;
      font-family: monospace;
      font-size: 12px;
    }

    /* Mobile: 100% Fullscreen, clean layout */
    @media (max-width: 599px), (max-height: 499px), (pointer: coarse) {
      .pc-controls-guide {
        display: none !important;
      }
    }
  </style>
</head>
<body>
  <div id="game-container">
    <canvas id="unity-canvas" tabindex="-1"></canvas>

    <!-- 4K High-Res Thumbnail Cover + 7-Second Capsule Loading Screen -->
    <div id="game-splash-overlay">
      <img src="thumbnail.jpg" alt="Mob Control" id="splash-bg-img">
      <div class="splash-vignette"></div>

      <div class="loader-bottom-area">
        <div class="capsule-track">
          <div id="capsule-bar" class="capsule-fill"></div>
          <span id="capsule-percent" class="capsule-percent">0%</span>
        </div>
        <div class="loader-status-text" id="loader-status-text">Loading...</div>
        <div class="tip-pill" id="tip-pill">
          💡 <span id="tip-text">Tip: Multiply your mob through Blue gates!</span>
        </div>
      </div>
    </div>

    <!-- PC Controls Guide (Floating HUD, desktop only) -->
    <div class="pc-controls-guide" id="pc-guide">
      <span>⌨️ <span class="pc-key">A</span> / <span class="pc-key">D</span> or <span class="pc-key">◄</span> / <span class="pc-key">►</span> Steer</span>
      <span>•</span>
      <span>🖱️ Drag to Move</span>
      <span>•</span>
      <span><span class="pc-key">Space</span> Tap to Start</span>
    </div>
  </div>

  <!-- Background Music Player (amin.mp3 in continuous loop, 100% volume, NO mute button) -->
  <audio id="bgm-player" src="amin.mp3" loop preload="auto"></audio>

  <!-- Complete Zero-Ad Poki SDK & PokiBridge Mock -->
  <script>
    window.pokiReady = true;
    window.pokiAdBlock = false;
    window.pokiBridge = null;

    let isGameSceneLoaded = false;
    let isMinTimerDone = false;
    let isGameRevealed = false;

    function revealGameNow() {
      if (isGameRevealed) return;
      isGameRevealed = true;

      const canvas = document.querySelector("#unity-canvas");
      const overlay = document.querySelector("#game-splash-overlay");
      const bar = document.getElementById("capsule-bar");
      const pct = document.getElementById("capsule-percent");

      if (bar) bar.style.width = "100%";
      if (pct) pct.textContent = "100%";

      console.log('[Runner] Revealing authentic 3D runner directly on gameplay scene!');

      // Smoothly fade in canvas and fade out splash overlay
      if (canvas) {
        canvas.style.opacity = "1";
        canvas.style.pointerEvents = "auto";
      }

      if (overlay) {
        overlay.style.opacity = "0";
        setTimeout(() => {
          overlay.style.display = "none";
        }, 550);
      }

      playBgmAudio();
    }

    function checkReadyToReveal() {
      if (isGameSceneLoaded && isMinTimerDone) {
        revealGameNow();
      }
    }

    // PokiBridge callback: GameObject in Game.unity awakens and connects
    window.initPokiBridge = function(name) {
      console.log('[PokiBridge] Game scene loaded and ready! Connected to:', name);
      window.pokiBridge = name;
      isGameSceneLoaded = true;
      checkReadyToReveal();

      function notifyReady() {
        if (window.unityGame) {
          try { window.unityGame.SendMessage(name, "ready"); } catch(e) {}
        } else {
          setTimeout(notifyReady, 50);
        }
      }
      notifyReady();
    };

    window.commercialBreak = function() {
      if (window.unityGame && window.pokiBridge) {
        try { window.unityGame.SendMessage(window.pokiBridge, "commercialBreakCompleted"); } catch(e) {}
      }
      return Promise.resolve();
    };

    window.rewardedBreak = function(options) {
      if (window.unityGame && window.pokiBridge) {
        try { window.unityGame.SendMessage(window.pokiBridge, "rewardedBreakCompleted", "true"); } catch(e) {}
      }
      return Promise.resolve(true);
    };

    window.PokiSDK = {
      init: function() { return Promise.resolve(); },
      gameplayStart: function() {
        console.log('[PokiSDK] gameplayStart fired');
        isGameSceneLoaded = true;
        checkReadyToReveal();
      },
      gameplayStop: function() {},
      gameLoadingStart: function() {},
      gameLoadingFinished: function() {
        console.log('[PokiSDK] gameLoadingFinished fired');
        isGameSceneLoaded = true;
        checkReadyToReveal();
      },
      commercialBreak: window.commercialBreak,
      rewardedBreak: window.rewardedBreak,
      displayAd: function() {},
      destroyAd: function() {},
      getLanguage: function() { return "en"; },
      getURLParam: function() { return ""; },
      isAdBlocked: function() { return false; },
      logError: function(err) {},
      measure: function() {},
      customEvent: function() {}
    };
  </script>

  <!-- Background Music Controller (Plays immediately on any touch/click, 100% volume) -->
  <script>
    const bgm = document.getElementById('bgm-player');
    if (bgm) {
      bgm.volume = 1.0;
    }

    function playBgmAudio() {
      if (bgm) {
        bgm.volume = 1.0;
        if (bgm.paused) {
          bgm.play().catch(e => {
            console.log('[BGM] Waiting for player tap/gesture to start audio');
          });
        }
      }
    }

    // Start playing background music on first tap anywhere (even on loading screen)
    window.addEventListener('pointerdown', playBgmAudio, { passive: true });
    window.addEventListener('touchstart', playBgmAudio, { passive: true });
    window.addEventListener('keydown', playBgmAudio, { passive: true });
    window.addEventListener('click', playBgmAudio, { passive: true });
  </script>

  <!-- Unity WebGL Loader -->
  <script src="Build/c7cea366ea8eaab59722a8d24073643f.loader.js"></script>

  <script>
    const canvas = document.querySelector("#unity-canvas");
    const capsuleBar = document.getElementById("capsule-bar");
    const capsulePercent = document.getElementById("capsule-percent");
    const statusText = document.getElementById("loader-status-text");
    const tipText = document.getElementById("tip-text");

    // Dynamic Mobile/PC detection check
    function checkDeviceView() {
      const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) || (window.matchMedia && window.matchMedia('(pointer: coarse)').matches) || window.innerWidth < 600;
      const pcGuide = document.getElementById("pc-guide");
      if (pcGuide) {
        pcGuide.style.display = isMobile ? "none" : "";
      }
    }
    window.addEventListener('resize', checkDeviceView);
    checkDeviceView();

    // Cycling gameplay tips
    const tips = [
      "Tip: Multiply your mob through Blue gates!",
      "Tip: Avoid Red gates to protect your army!",
      "Tip: Hold and drag to steer smoothly!",
      "Tip: Overwhelm the final castle with maximum troops!"
    ];
    let tipIdx = 0;
    setInterval(() => {
      tipIdx = (tipIdx + 1) % tips.length;
      if (tipText) tipText.textContent = tips[tipIdx];
    }, 2400);

    // EXACT 7-SECOND PROGRESS COUNTER
    const TOTAL_LOAD_MS = 7000;
    const startTime = performance.now();

    function updateProgress() {
      if (isGameRevealed) return;

      const elapsed = performance.now() - startTime;
      let progress = Math.min(99, Math.floor((elapsed / TOTAL_LOAD_MS) * 100));

      if (capsuleBar) capsuleBar.style.width = progress + "%";
      if (capsulePercent) capsulePercent.textContent = progress + "%";

      if (elapsed >= TOTAL_LOAD_MS) {
        isMinTimerDone = true;
        if (statusText) statusText.textContent = "Starting game...";
        checkReadyToReveal();
      }

      if (!isGameRevealed) {
        requestAnimationFrame(updateProgress);
      }
    }
    requestAnimationFrame(updateProgress);

    // Dynamic Mobile Performance Optimization
    const isMobileDevice = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) || window.innerWidth < 600;
    let dynamicDPR = Math.min(window.devicePixelRatio || 1, isMobileDevice ? 1.5 : 2.0);

    const buildUrl = "Build";
    const config = {
      dataUrl: buildUrl + "/180b03074745078a7fe292b2c22f6060.data.unityweb",
      frameworkUrl: buildUrl + "/2320a17ab13f3e61f4a62a2cc0382528.framework.js.unityweb",
      codeUrl: buildUrl + "/f1c87ec2ef0c4ed9b3c34bb439b0c5de.wasm.unityweb",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "Jungle Tavern",
      productName: "Count Control Legends",
      productVersion: "1.0.0",
      devicePixelRatio: dynamicDPR
    };

    createUnityInstance(canvas, config, (progress) => {
      // Mandatory Unity progress handler
    }).then((unityInstance) => {
      window.unityInstance = unityInstance;
      window.unityGame = unityInstance;

      // When Unity engine starts, give level0 StartupManager 2.8s to load Game.unity
      setTimeout(() => {
        isGameSceneLoaded = true;
        checkReadyToReveal();
      }, 2800);

      if (window.pokiBridge) {
        try { window.unityGame.SendMessage(window.pokiBridge, "ready"); } catch(e) {}
      }
    }).catch((err) => {
      console.error("Unity Load Error:", err);
      // Guarantee reveal on error
      isGameSceneLoaded = true;
      isMinTimerDone = true;
      revealGameNow();
    });

    // Fallback safety: under no circumstances can the screen stay on loading longer than 11s
    setTimeout(() => {
      isGameSceneLoaded = true;
      isMinTimerDone = true;
      revealGameNow();
    }, 11000);

    // PC Keyboard Steer Helper: Seamless A/D & Arrow Left/Right to simulated drag
    let isKeySteering = false;
    const activeKeys = {};

    window.addEventListener('keydown', (e) => {
      activeKeys[e.code] = true;
      if (e.code === 'KeyA' || e.code === 'ArrowLeft' || e.code === 'KeyD' || e.code === 'ArrowRight') {
        if (!isKeySteering) {
          isKeySteering = true;
          startKeyDrag();
        }
      }
    });

    window.addEventListener('keyup', (e) => {
      delete activeKeys[e.code];
      if (!activeKeys['KeyA'] && !activeKeys['ArrowLeft'] && !activeKeys['KeyD'] && !activeKeys['ArrowRight']) {
        isKeySteering = false;
        stopKeyDrag();
      }
    });

    let dragInterval = null;
    let curX = 0;
    let curY = 0;

    function startKeyDrag() {
      const rect = canvas.getBoundingClientRect();
      curX = rect.left + rect.width / 2;
      curY = rect.top + rect.height * 0.7;

      canvas.dispatchEvent(new PointerEvent('pointerdown', {
        clientX: curX,
        clientY: curY,
        bubbles: true,
        pointerId: 1
      }));

      if (dragInterval) clearInterval(dragInterval);
      dragInterval = setInterval(() => {
        if (!isKeySteering) {
          clearInterval(dragInterval);
          return;
        }
        let dir = 0;
        if (activeKeys['KeyA'] || activeKeys['ArrowLeft']) dir -= 1;
        if (activeKeys['KeyD'] || activeKeys['ArrowRight']) dir += 1;

        const rect = canvas.getBoundingClientRect();
        curX += dir * 18;
        curX = Math.max(rect.left + 20, Math.min(rect.right - 20, curX));

        canvas.dispatchEvent(new PointerEvent('pointermove', {
          clientX: curX,
          clientY: curY,
          bubbles: true,
          pointerId: 1
        }));
      }, 16);
    }

    function stopKeyDrag() {
      if (dragInterval) clearInterval(dragInterval);
      canvas.dispatchEvent(new PointerEvent('pointerup', {
        clientX: curX,
        clientY: curY,
        bubbles: true,
        pointerId: 1
      }));
    }
  </script>
</body>
</html>
